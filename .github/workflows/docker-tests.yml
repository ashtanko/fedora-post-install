name: docker-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
        stage: [smoke, idempotency]
    name: ${{ matrix.stage }} / fedora-${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.fedora }}-${{ hashFiles('tests/Dockerfile') }}
          restore-keys: |
            buildx-${{ matrix.fedora }}-

      - name: Run ${{ matrix.stage }} on Fedora ${{ matrix.fedora }}
        env:
          DOCKER_BUILD_CACHE_DIR: /tmp/.buildx-cache
        run: bash tests/run-in-docker.sh ${{ matrix.fedora }} ${{ matrix.stage }}
