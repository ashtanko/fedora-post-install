name: lint

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify runner tools
        run: shellcheck --version
      - name: Run all local checks
        run: make check
